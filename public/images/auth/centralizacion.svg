<?xml version="1.0" encoding="UTF-8"?>
<!-- Sistema de Leads — ilustración original "centralización de datos" para el panel de auth. Fondo navy fijo + color de marca (#008dc5 / #40aad4), sin dependencias externas. -->
<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#132846" />
      <stop offset="100%" stop-color="#070d18" />
    </radialGradient>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#40aad4" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#40aad4" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#40aad4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#40aad4" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#bg)" />

  <!-- grid sutil -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 120H800M0 240H800M0 360H800M0 480H800M0 600H800M0 720H800" />
    <path d="M120 0V800M280 0V800M440 0V800M600 0V800M760 0V800" />
  </g>

  <!-- particulas -->
  <g fill="#40aad4" fill-opacity="0.5">
    <circle cx="150" cy="180" r="2.5" />
    <circle cx="640" cy="150" r="2" />
    <circle cx="700" cy="420" r="2.5" />
    <circle cx="110" cy="520" r="2" />
    <circle cx="220" cy="650" r="2" />
    <circle cx="590" cy="660" r="2.5" />
    <circle cx="400" cy="90" r="2" />
  </g>

  <!-- lineas curvas desde las 4 fuentes hacia el hub central (400,410) -->
  <g fill="none" stroke="url(#line)" stroke-width="2.5">
    <path d="M175,205 C260,260 320,320 385,395" />
    <path d="M625,190 C540,250 470,310 410,390" />
    <path d="M150,560 C240,520 310,470 385,420" />
    <path d="M640,590 C550,540 470,480 415,420" />
  </g>

  <!-- nodo: formulario -->
  <g transform="translate(115,150)">
    <rect x="0" y="0" width="72" height="84" rx="10" fill="#0e1b30" stroke="#40aad4" stroke-opacity="0.6" stroke-width="1.5" />
    <g stroke="#8fd2ea" stroke-width="3" stroke-linecap="round">
      <line x1="14" y1="22" x2="58" y2="22" />
      <line x1="14" y1="38" x2="58" y2="38" />
      <line x1="14" y1="54" x2="42" y2="54" />
    </g>
  </g>

  <!-- nodo: hoja de calculo -->
  <g transform="translate(575,120)">
    <rect x="0" y="0" width="80" height="80" rx="10" fill="#0e1b30" stroke="#40aad4" stroke-opacity="0.6" stroke-width="1.5" />
    <g stroke="#8fd2ea" stroke-opacity="0.85" stroke-width="1.5">
      <line x1="0" y1="27" x2="80" y2="27" />
      <line x1="0" y1="53" x2="80" y2="53" />
      <line x1="27" y1="0" x2="27" y2="80" />
      <line x1="53" y1="0" x2="53" y2="80" />
    </g>
  </g>

  <!-- nodo: telefono / offline -->
  <g transform="translate(80,505)">
    <rect x="0" y="0" width="56" height="96" rx="12" fill="#0e1b30" stroke="#40aad4" stroke-opacity="0.6" stroke-width="1.5" />
    <rect x="8" y="12" width="40" height="62" rx="3" fill="#132846" />
    <circle cx="28" cy="84" r="4" fill="#8fd2ea" fill-opacity="0.85" />
  </g>

  <!-- nodo: landing / navegador -->
  <g transform="translate(560,545)">
    <rect x="0" y="0" width="88" height="66" rx="8" fill="#0e1b30" stroke="#40aad4" stroke-opacity="0.6" stroke-width="1.5" />
    <rect x="0" y="0" width="88" height="16" rx="8" fill="#132846" />
    <circle cx="10" cy="8" r="2.5" fill="#8fd2ea" fill-opacity="0.85" />
    <circle cx="20" cy="8" r="2.5" fill="#8fd2ea" fill-opacity="0.55" />
    <line x1="14" y1="34" x2="74" y2="34" stroke="#8fd2ea" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8" />
    <line x1="14" y1="48" x2="56" y2="48" stroke="#8fd2ea" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6" />
  </g>

  <!-- hub central -->
  <circle cx="400" cy="410" r="130" fill="url(#hubGlow)" />
  <circle cx="400" cy="410" r="46" fill="#0b1730" stroke="#40aad4" stroke-width="2" />
  <circle cx="400" cy="410" r="46" fill="none" stroke="#40aad4" stroke-width="1" stroke-opacity="0.35">
    <animate attributeName="r" values="46;62;46" dur="4s" repeatCount="indefinite" />
    <animate attributeName="stroke-opacity" values="0.35;0;0.35" dur="4s" repeatCount="indefinite" />
  </circle>
  <g stroke="#8fd2ea" stroke-width="3" stroke-linecap="round">
    <circle cx="400" cy="410" r="6" fill="#8fd2ea" stroke="none" />
    <line x1="400" y1="390" x2="400" y2="396" />
    <line x1="400" y1="424" x2="400" y2="430" />
    <line x1="380" y1="410" x2="386" y2="410" />
    <line x1="414" y1="410" x2="420" y2="410" />
  </g>
</svg>
